# Getnera: landing, customer app, admin panel and API on one VPS.
# Copy to /etc/nginx/sites-available/getnera, link into sites-enabled,
# then run certbot (see deploy/README.md) to add HTTPS.

# Landing page: getnera.in (www redirects to the bare domain)
server {
  listen 80;
  server_name www.getnera.in;
  return 301 https://getnera.in$request_uri;
}
server {
  listen 80;
  server_name getnera.in;
  root /var/www/getnera/landing;
  index index.html;

  # Customers log in on the app domain (the session lives there).
  location = /login { return 301 https://app.getnera.in/login; }
  location = /privacy-policy.html { return 301 /privacy-policy; }
  location = /terms.html { return 301 /terms; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ $uri.html /index.html; }
}

# Customer panel: app.getnera.in
server {
  listen 80;
  server_name app.getnera.in;
  root /var/www/getnera/app;
  index index.html;

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; }
}

# Admin panel: admin.getnera.in
server {
  listen 80;
  server_name admin.getnera.in;
  root /var/www/getnera/admin;
  index index.html;

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; }
}

# API, socket.io and Meta webhooks: api.getnera.in -> Node on 127.0.0.1:3601 (3600 is the old leados-api)
server {
  listen 80;
  server_name api.getnera.in;
  client_max_body_size 25m;

  location / {
    proxy_pass http://127.0.0.1:3601;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
